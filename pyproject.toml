[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".hypothesis",
    "ml_validation_output",
    "test_data",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["ig", "options", "utils", "vpa"]

[tool.pytest.ini_options]
testpaths = ["vpa/tests", "options/tests"]
norecursedirs = [
    ".venv",
    "__pycache__",
    ".git",
    ".hypothesis",
    "ml_validation_output",
    "test_data",
    ".ruff_cache",
    ".pytest_cache",
]
